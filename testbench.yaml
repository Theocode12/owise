laravel: '@testbench'

providers:
  - Owise\WiseServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

workbench:
  start: '/'
  install: true
  discovers:
    web: false
    api: false
    commands: false
    components: false
    views: false
  build:
    - create-sqlite-db
    - migrate:refresh
